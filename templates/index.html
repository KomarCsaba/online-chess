<!DOCTYPE html>
<html>
<head>
    <title>Chess</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

                #message {
                    color: white;
                    font-size: 24px;
                    margin-bottom: 20px;
                    text-align: center;
                }

                #status {
                    color: #aaa;
                    font-size: 18px;
                    margin-top: 10px;
                }

                #board {
                    display: grid;
                    grid-template-columns: repeat(8, 80px);
                    grid-template-rows: repeat(8, 80px);
                    border: 2px solid #555;
                }

                .square {
                    width: 80px;
                    height: 80px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 52px;
                    cursor: pointer;
                    user-select: none;
                }

                .light { background-color: #f0d9b5; }
                .dark { background-color: #b58863; }
                .selected { background-color: #7fc97f !important; }
                .possible-move {position: relative;}
                .possible-move::after {
                    content: "";
                    position: absolute;
                    width: 30%;
                    height: 30%;
                    background-color: rgba(0, 0, 0, 0.2);
                    border-radius: 50%;
                }
                .possible-move.has-piece::after {
                    width: 100%;
                    height: 100%;
                    background-color: transparent;
                    border-radius: 50%;
                    box-shadow: inset 0 0 0 6px rgba(0, 0, 0, 0.2);
                }
                .in-check { background-color: #ff6b6b !important; }
                #container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #move-list {
            width: 180px;
            height: 640px;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            color: white;
            font-size: 14px;
            font-family: Arial;
        }

        #move-list h3 {
            margin: 0 0 10px 0;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .move-row {
            display: flex;
            gap: 5px;
            margin-bottom: 4px;
        }

        .move-number {
            color: #666;
            width: 25px;
        }

        .move-white, .move-black {
            width: 65px;
            padding: 2px 4px;
            border-radius: 3px;
            cursor: default;
        }

        .move-white:hover, .move-black:hover {
            background-color: #3a3a3a;
        }
    </style>
</head>
<body>
    <div id="message">Connecting...</div>
    <div id="container">
        <div id="board"></div>
        <div id="move-list">
            <h3>Moves</h3>
            <div id="moves"></div>
        </div>
    </div>
    <div id="status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        const boardEl = document.getElementById("board");
        const messageEl = document.getElementById("message");
        const statusEl = document.getElementById("status");

        let myColor = null;
        let selectedSquare = null;
        let currentState = null;
        let legalMovesForSelected = [];

        // chess piece unicode symbols
        const PIECES = {
            "K": "♔", "Q": "♕", "R": "♖", "B": "♗", "N": "♘", "P": "♙",  // white
            "k": "♚", "q": "♛", "r": "♜", "b": "♝", "n": "♞", "p": "♟"   // black
        };

        function colRowToUci(col, row) {
            // convert grid position to chess notation (e.g. 0,0 -> a8)
            return String.fromCharCode(97 + col) + (8 - row);
        }

        function buildBoard() {
            boardEl.innerHTML = "";
            const rows = myColor === "black" ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
            const cols = myColor === "black" ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
            for (let row of rows) {
                for (let col of cols) {
                    const square = document.createElement("div");
                    square.className = "square " + ((row + col) % 2 === 0 ? "light" : "dark");
                    square.dataset.col = col;
                    square.dataset.row = row;
                    square.addEventListener("click", onSquareClick);
                    boardEl.appendChild(square);
                }
            }
        }

        function updateBoard(state) {
    currentState = state;
        const squares = boardEl.querySelectorAll(".square");

        squares.forEach(sq => {
            const col = parseInt(sq.dataset.col);
            const row = parseInt(sq.dataset.row);
            const key = `${col},${row}`;

            // reset classes
            sq.className = "square " + ((row + col) % 2 === 0 ? "light" : "dark");
            sq.textContent = "";

            // place piece if there is one
            if (state.pieces[key]) {
                sq.textContent = PIECES[state.pieces[key].type];
            }

            // highlight king in check
            if (state.in_check) {
                const kingSymbol = state.turn === "white" ? "K" : "k";
                if (state.pieces[key] && state.pieces[key].type === kingSymbol) {
                    sq.classList.add("in-check");
                }
            }

            // highlight selected square
            if (selectedSquare && selectedSquare.col === col && selectedSquare.row === row) {
                sq.classList.add("selected");
            }

            // highlight possible moves
            if (legalMovesForSelected.includes(`${col},${row}`)) {
                sq.classList.add("possible-move");
                if (currentState.pieces[key]) {
                    sq.classList.add("has-piece");
                }
            }
        });

        // update status
        if (myColor) {
            const isMyTurn = state.turn === myColor;
            statusEl.textContent = isMyTurn ? "Your turn" : "Opponent's turn";
        }

        // update move list
        const movesEl = document.getElementById("moves");
        movesEl.innerHTML = "";
        for (let i = 0; i < state.moves.length; i += 2) {
            const row = document.createElement("div");
            row.className = "move-row";

            const number = document.createElement("span");
            number.className = "move-number";
            number.textContent = `${Math.floor(i/2) + 1}.`;

            const white = document.createElement("span");
            white.className = "move-white";
            white.textContent = state.moves[i];

            row.appendChild(number);
            row.appendChild(white);

            if (state.moves[i+1]) {
                const black = document.createElement("span");
                black.className = "move-black";
                black.textContent = state.moves[i+1];
                row.appendChild(black);
            }

            movesEl.appendChild(row);
        }

        // auto scroll to bottom
        movesEl.scrollTop = movesEl.scrollHeight;
    }

        function getLegalMovesForSquare(col, row) {
            // ask server for legal moves would be ideal but for now
            // we just let the server validate and show all squares as possible
            // this is simplified - we'll just highlight nothing for now
            return [];
        }

        function onSquareClick(e) {
            if (!currentState || !myColor) return;
            if (currentState.turn !== myColor) return;

            const col = parseInt(e.currentTarget.dataset.col);
            const row = parseInt(e.currentTarget.dataset.row);
            const key = `${col},${row}`;
            const piece = currentState.pieces[key];

            if (selectedSquare === null) {
                // select a piece if it belongs to us
                if (piece && piece.color === myColor) {
                    selectedSquare = { col, row };
                    // ask server for legal moves
                    socket.emit("get_moves", { col, row });
                    updateBoard(currentState);
                }
            } else {
                // if clicking our own piece, select that instead
                if (piece && piece.color === myColor) {
                    selectedSquare = { col, row };
                    legalMovesForSelected = [];
                    socket.emit("get_moves", { col, row });
                    updateBoard(currentState);
                    return;
                }

                // try to move
                const from = colRowToUci(selectedSquare.col, selectedSquare.row);
                const to = colRowToUci(col, row);
                let move = from + to;

                // handle pawn promotion
                const pieceAtFrom = currentState.pieces[`${selectedSquare.col},${selectedSquare.row}`];
                if (pieceAtFrom && pieceAtFrom.type.toLowerCase() === "p") {
                    if ((myColor === "white" && row === 0) || (myColor === "black" && row === 7)) {
                        move += "q";
                    }
                }

                socket.emit("move", { move });
                selectedSquare = null;
                legalMovesForSelected = [];
                updateBoard(currentState);
            }
        }

        // receive legal moves from server and highlight them
        socket.on("legal_moves", data => {
            legalMovesForSelected = data.moves;
            updateBoard(currentState);
        });

        socket.on("waiting", data => {
            myColor = data.color;
            messageEl.textContent = "Waiting for an opponent...";
            buildBoard();
        });

        socket.on("start", data => {
            myColor = data.color;
            messageEl.textContent = `You are playing as ${myColor}`;
            buildBoard();
        });

        socket.on("board_state", state => {
            updateBoard(state);
        });

        socket.on("invalid_move", () => {
            selectedSquare = null;
            updateBoard(currentState);
        });

        socket.on("game_over", data => {
            messageEl.textContent = data.result;
            statusEl.textContent = "Refresh to play again";
            currentState = null;
        });

        socket.on("opponent_left", () => {
            messageEl.textContent = "Opponent disconnected!";
            statusEl.textContent = "Refresh to play again";
        });
    </script>
</body>
</html>
